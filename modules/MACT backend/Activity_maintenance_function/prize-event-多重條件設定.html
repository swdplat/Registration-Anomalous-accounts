<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <link href="../../../css/style.css" rel="stylesheet" type="text/css" />
    <script type="text/javascript" src="../../../js/jquery-3.7.1.min.js"></script>
    <script type="text/javascript" src="../../../js/prize.js"></script>
    <script type="text/javascript" src="../../../js/components.js"></script>
    <script type="text/javascript" src="../../../js/calendar.js"></script>
    <script type="text/javascript" src="../../../js/pagination.js"></script>
    <script type="text/javascript" src="../../../js/toast-message.js"></script>
    <script type="text/javascript" src="../../../js/scroll-to-edge.js"></script>
    <title>設定活動條件</title>
</head>

<body>
    <main>
        <header class="header">
            <button type="button" class="btn-sec btn-back larg"><i class="material-symbols-outlined">arrow_back</i></button>
            <h1>設定活動條件</h1>
        </header>
        <div class="search-bar mar-tl">
            <div class="col-4">
                <label for="game-name">活動條件</label>
                <select id="game-name">
                    <option value="" disabled>請選擇</option>
                    <option value="多重條件設定" selected>多重條件設定</option>
                    <option value="遊戲B">遊戲B</option>
                    <option value="遊戲C">遊戲C</option>
                </select>
            </div>
            <div class="col-4">
                <label>活動代號</label>
                <p>2024072201</p>
            </div>
            <div class="col-4">
                <label>活動名稱</label>
                <p>參加指定活動</p>
            </div>
        </div>

        <button class="btn-pri larg insert-button">新增資料</button>

        <div class="row">
            <div class="table-pagination-wrap" data-pagination-root data-page-size="10">
                <table class="item-list col" data-pagination-table>
                    <thead>
                        <tr>
                            <th>功能</th>
                            <th>活動條件</th>
                            <th>會員資格代碼</th>
                        </tr>
                    </thead>
                    <tbody data-pagination-body>
                        <tr>
                            <td>
                                <div class="action-btns">
                                    <label class="switch">
                                        <input type="checkbox">
                                        <span class="slider round"></span>
                                    </label>
                                    <button class="btn-text">編輯</button>
                                </div>
                            </td>
                            <td>無</td>
                            <td>M221117002</td>
                        </tr>
                        <tr>
                            <td>
                                <div class="action-btns">
                                    <label class="switch">
                                        <input type="checkbox">
                                        <span class="slider round"></span>
                                    </label>
                                    <button class="btn-text">編輯</button>
                                </div>
                            </td>
                            <td>卡號密碼</td>
                            <td>-</td>
                        </tr>
                        <tr>
                            <td>
                                <div class="action-btns">
                                    <label class="switch">
                                        <input type="checkbox">
                                        <span class="slider round"></span>
                                    </label>
                                    <button class="btn-text">編輯</button>
                                </div>
                            </td>
                            <td>活動序號</td>
                            <td>M221117002</td>
                        </tr>
                        <tr>
                            <td>
                                <div class="action-btns">
                                    <label class="switch">
                                        <input type="checkbox">
                                        <span class="slider round"></span>
                                    </label>
                                    <button class="btn-text">編輯</button>
                                </div>
                            </td>
                            <td>單筆滿額送</td>
                            <td>-</td>
                        </tr>
                    </tbody>
                </table>
                <div class="pagination" data-pagination>
                    <button type="button" class="first-page" data-pagination-action="first">第一頁</button>
                    <button type="button" class="pre-page" data-pagination-action="prev">上一頁</button>
                    <button type="button" class="page-number active" data-pagination-page="1">1</button>
                    <button type="button" class="page-number" data-pagination-page="2">2</button>
                    <button type="button" class="page-number" data-pagination-page="3">3</button>
                    <button type="button" class="next-page" data-pagination-action="next">下一頁</button>
                    <button type="button" class="last-page" data-pagination-action="last">最後一頁</button>
                </div>
            </div>
        </div>
    </main>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <link href="../../../css/style.css" rel="stylesheet" type="text/css" />
    <script type="text/javascript" src="../../../js/jquery-3.7.1.min.js"></script>
    <script type="text/javascript" src="../../../js/prize.js"></script>
    <script type="text/javascript" src="../../../js/components.js"></script>
    <script type="text/javascript" src="../../../js/calendar.js"></script>
    <script type="text/javascript" src="../../../js/dual-listbox.js"></script>
    <script type="text/javascript" src="../../../js/scroll-to-edge.js"></script>
    <title>設定活動條件</title>
</head>

<body>
    <main>
        <header class="header">
            <h1>新增一筆資料</h1>
        </header>
        <div class="search-bar mar-tl">
            <div class="col-4">
                <label>活動代號</label>
                <p>2024072201</p>
            </div>
            <div class="col-4">
                <label>活動名稱</label>
                <p>參加指定活動</p>
            </div>
        </div>
        <form>
            <section>
                <div class="row">
                    <div class="listbox-wrap col">
                        <div class="dual-listbox-container mar-0">
                            <div class="unset-wrapper">
                                <h3>可供選擇的項目</h3>
                                <div class="searchbar">
                                    <input type="search" placeholder="搜尋..." />
                                    <p class="unset-counter"></p>
                                    <div class="trailing-element">
                                        <button type="button" class="btn-sec small" data-add-button>清除選取</button>
                                    </div>
                                </div>
                                <ul>
                                    <li>台灣</li>
                                    <li>中國</li>
                                    <li>香港</li>
                                    <li>澳門</li>
                                    <li>新加坡</li>
                                    <li>馬來西亞</li>
                                    <li>泰國</li>
                                    <li>印尼</li>
                                    <li>菲律賓</li>
                                    <li>越南</li>
                                    <li>全球</li>
                                </ul>
                            </div>
                            <div class="control-wrapper">
                                <button type="button" class="set"><span
                                        class="material-symbols-outlined fz-4xl">chevron_right</span></button>
                                <button type="button" class="set-all"><span
                                        class="material-symbols-outlined fz-4xl">keyboard_double_arrow_right</span></button>
                                <button type="button" class="unset-all"><span
                                        class="material-symbols-outlined fz-4xl">keyboard_double_arrow_left</span></button>
                                <button type="button" class="unset"><span
                                        class="material-symbols-outlined fz-4xl">chevron_left</span></button>
                            </div>
                            <div class="set-wrapper">
                                <h3>已選擇的項目</h2>
                                    <div class="searchbar">
                                        <input type="search" placeholder="搜尋..." />
                                        <p class="set-counter"></p>
                                        <div class="trailing-element">
                                            <button type="button" class="btn-sec small" data-add-button>清除選取</button>
                                        </div>
                                    </div>
                                    <ul>
                                    </ul>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </form>

        <div class="bottom">
            <button class="btn-pri larg">下一步</button>
            <button class="btn-sec larg">取消</button>
        </div>
    </main>
</body>

</html>

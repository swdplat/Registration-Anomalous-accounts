<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <link type="text/css" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
        rel="stylesheet" />
    <link type="text/css" rel="stylesheet" href="../../../css/style.css" />
    <link type="text/css" rel="stylesheet" href="../../../css/select2.css" />
    <script type="text/javascript" src="../../../js/jquery-3.7.1.min.js"></script>
    <script type="text/javascript" src="../../../js/select2.min.js"></script>
    <script type="text/javascript" src="../../../js/prize.js"></script>
    <script type="text/javascript" src="../../../js/components.js"></script>
    <script type="text/javascript" src="../../../js/switch-controls.js"></script>
    <script type="text/javascript" src="../../../js/calendar.js"></script>
    <script type="text/javascript" src="../../../js/pagination.js"></script>
    <script type="text/javascript" src="../../../js/dual-listbox.js"></script>
    <script type="text/javascript" src="../../../js/popup.js"></script>
    <script type="text/javascript" src="../../../js/searchSelect.js"></script>
    <script type="text/javascript" src="../../../js/toast-message.js"></script>
    <script type="text/javascript" src="../../../js/tooltip.js"></script>
    <script type="text/javascript" src="../../../js/scroll-to-edge.js"></script>
    <title>領獎專區</title>
</head>

<body>
    <main>
        <div class="search-bar">
            <div>
                <label for="event-id">活動代號</label>
                <input id="event-id" type="text" placeholder="請輸入" />
            </div>
            <div>
                <label for="event-name">活動名稱</label>
                <input id="event-name" type="text" placeholder="請輸入" />
            </div>
            <div class="field">
                <label>活動主入口</label>
                <select class="select2-search">
                    <option selected>請選擇</option>
                    <option>選項A</option>
                    <option>選項B</option>
                    <option>選項C</option>
                </select>
            </div>
            <div class="field">
                <label>語系選擇</label>
                <select class="select2-search">
                    <option selected>請選擇</option>
                    <option>選項A</option>
                    <option>選項B</option>
                    <option>選項C</option>
                </select>
            </div>
            <div class="field">
                <label>審核狀態</label>
                <select class="select2-search">
                    <option selected>請選擇</option>
                    <option>選項A</option>
                    <option>選項B</option>
                    <option>選項C</option>
                </select>
            </div>
            <div class="field">
                <label>活動條件</label>
                <select class="select2-search">
                    <option selected>請選擇</option>
                    <option>選項A</option>
                    <option>選項B</option>
                    <option>選項C</option>
                </select>
            </div>
            <button class="btn-sec larg">查詢</button>
        </div>

        <div class="row row-between row-hcenter">
            <button class="btn-pri larg insert-button">新增資料</button>
            <div class="field mar-bm">
                <select>
                    <option>10</option>
                    <option>50</option>
                    <option>100</option>
                </select>
            </div>
        </div>

        <div class="row">
            <p class="text-c pad-yl">查無符合條件的資料</p>
        </div>
    </main>
</body>

</html>
